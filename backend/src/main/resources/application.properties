spring.application.name=backend

# දැනට database නෑ (mock data). Aweega ගේ DB ready වුණාම මෙතනට Postgres settings දානවා.
spring.jpa.hibernate.ddl-auto=none

# Actuator: health endpoint එක පමණක්
management.endpoints.web.exposure.include=health

# Dev users (environment variables වලින් override කරන්න පුළුවන්)
app.security.analyst-password=${ANALYST_PASSWORD:analyst123}
app.security.admin-password=${ADMIN_PASSWORD:admin123}

# React dev server එකට ඉඩ දෙන්න
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
spring.jpa.open-in-view=false