spring.application.name=backend


spring.jpa.hibernate.ddl-auto=none


management.endpoints.web.exposure.include=health


app.security.analyst-password=${ANALYST_PASSWORD:analyst123}
app.security.admin-password=${ADMIN_PASSWORD:admin123}


app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
spring.jpa.open-in-view=false

# Folder where the Python pipeline writes its output
pipeline.data-dir=${PIPELINE_DATA_DIR:../data}