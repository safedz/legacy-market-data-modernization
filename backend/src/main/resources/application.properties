spring.application.name=backend


spring.jpa.hibernate.ddl-auto=none


management.endpoints.web.exposure.include=health


app.security.analyst-password=${ANALYST_PASSWORD:analyst123}
app.security.admin-password=${ADMIN_PASSWORD:admin123}


app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
spring.jpa.open-in-view=false


pipeline.data-dir=${PIPELINE_DATA_DIR:../data}


pipeline.source=${PIPELINE_SOURCE:csv}


spring.datasource.url=${DB_URL:jdbc:h2:mem:backend}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
