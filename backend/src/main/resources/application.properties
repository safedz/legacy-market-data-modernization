spring.application.name=backend
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
app.security.analyst-password=${ANALYST_PASSWORD:analyst123}
app.security.admin-password=${ADMIN_PASSWORD:admin123}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
# Pipeline configuration
pipeline.data-dir=${PIPELINE_DATA_DIR:../data}
pipeline.source=${PIPELINE_SOURCE:csv}
# Database configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:backend}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# DuckDB analytics
analytics.script=${ANALYTICS_SCRIPT:../analytics/duckdb_analytics.py}
analytics.python-command=${PYTHON_COMMAND:python}
# Cloud storage configuration
analytics.source=${ANALYTICS_SOURCE:local}
analytics.r2-bucket=${R2_BUCKET:}
analytics.r2-account-id=${R2_ACCOUNT_ID:}
analytics.r2-access-key-id=${R2_ACCESS_KEY_ID:}
analytics.r2-secret-access-key=${R2_SECRET_ACCESS_KEY:}
analytics.r2-object-key=${R2_OBJECT_KEY:curated/20261114T141739Z_bd672f66/validated_messages.parquet}
analytics.extension-directory=${DUCKDB_EXTENSION_DIRECTORY:../duckdb_extensions}
